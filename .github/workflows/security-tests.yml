name: Security Tests

on:
  push:
    branches: [master]
    paths:
      - '**.php'
      - '**.css'
      - '**.js'
      - 'tests/**'
      - '.github/workflows/security-tests.yml'
      - '.env.example'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check security-test credentials
        env:
          ADMIN_PASS: ${{ secrets.DDNS_ADMIN_PASS }}
          TEST_PASS: ${{ secrets.DDNS_TEST_PASS }}
        run: |
          test -n "$ADMIN_PASS" || { echo "::error::Missing repository secret DDNS_ADMIN_PASS"; exit 1; }
          test -n "$TEST_PASS" || { echo "::error::Missing repository secret DDNS_TEST_PASS"; exit 1; }

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Run security tests
        env:
          DDNS_ADMIN_PASS: ${{ secrets.DDNS_ADMIN_PASS }}
          DDNS_TEST_PASS: ${{ secrets.DDNS_TEST_PASS }}
        run: pytest tests/test_security.py -v --tb=short
